name: Deploy to GitHub Pages

# ينشر الواجهة (SPA ثابت) على GitHub Pages.
# الرابط الناتج: https://<user>.github.io/azizmf1/
on:
  push:
    branches: [claude/hunting-medical-standalone]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Build (Pages base path)
        run: npm run build
        env:
          VITE_BASE: /azizmf1/
      - name: SPA fallback (deep links)
        run: cp dist/index.html dist/404.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
