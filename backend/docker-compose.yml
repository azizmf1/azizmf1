# قاعدة بيانات التطوير المحلي — PostgreSQL.
# للتشغيل: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: seha-hms-db
    environment:
      POSTGRES_DB: seha_hms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - seha_pg:/var/lib/postgresql/data

volumes:
  seha_pg:
